<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flights · SkyFare</title><link rel="stylesheet" href="/__fbn/style.css"></head>
<body class="site-flights"><header class="top"><a class="brand" href="/flights/">SkyFare</a>
<nav aria-label="Main"><a href="/flights/">Flights</a><a href="/flights/trips">My trips</a></nav></header><main id="main"><style>.listbox{position:absolute;z-index:5;background:#fff;border:1px solid #bbc;list-style:none;margin:0;padding:0;min-width:260px}
.listbox li{padding:8px;cursor:pointer}.listbox li:hover{background:#e8f0fb}.field{position:relative}.calendar{position:absolute;z-index:6;width:300px}
.calendar .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.calendar .grid button{padding:6px 0}.price{font-size:18px;font-weight:700}
.sr{position:absolute;clip:rect(0 0 0 0)}</style><h1>Find a flight</h1><form class="card" id="search" action="/flights/results" method="get">
<fieldset class="row" style="border:0;padding:0"><legend class="sr">Trip type</legend>
<label><input type="radio" name="trip" value="return" checked> Round trip</label>
<label><input type="radio" name="trip" value="oneway"> One way</label></fieldset>
<div class="row"><div class="field"><label for="from">From</label>
<input id="from" name="from_text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="from-list"
 autocomplete="off" placeholder="City or airport" value=""><input type="hidden" name="from" value="">
<ul id="from-list" role="listbox" class="listbox" hidden></ul></div>
<div class="field"><label for="to">To</label>
<input id="to" name="to_text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="to-list"
 autocomplete="off" placeholder="City or airport" value=""><input type="hidden" name="to" value="">
<ul id="to-list" role="listbox" class="listbox" hidden></ul></div></div>
<div class="row"><div class="field"><label for="depart">Depart</label>
<input id="depart" name="depart_text" class="date" placeholder="MM/DD/YYYY" autocomplete="off" value="">
<input type="hidden" name="depart" value=""></div>
<div class="field"><label for="return">Return</label>
<input id="return" name="return_text" class="date" placeholder="MM/DD/YYYY" autocomplete="off" value="">
<input type="hidden" name="return" value=""></div>
<div class="field"><label for="pax">Passengers</label><select id="pax" name="pax"><option value="1" selected>1 adult</option><option value="2">2 adults</option><option value="3">3 adults</option><option value="4">4 adults</option><option value="5">5 adults</option><option value="6">6 adults</option></select></div></div>
<p><button type="submit">Search flights</button></p></form>
<div id="calendar" role="dialog" aria-label="Choose a date" class="card calendar" hidden></div><script src="/flights/app.js"></script></main>
<footer class="foot">SkyFare is a foxbench mock site. Nothing here is real.</footer></body></html>
