<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up · Kitebase</title><link rel="stylesheet" href="/__fbn/style.css"></head>
<body class="site-signup"><header class="top"><a class="brand" href="/signup/">Kitebase</a>
<nav aria-label="Main"><a href="/signup/">Sign up</a><a href="/signup/contact">Contact</a></nav></header><main id="main"><h1>Create your Kitebase account</h1><p class="muted">Kite-flying logs, weather alerts and spot maps for your crew.</p>
<form class="card" method="post" action="/signup/" novalidate>
<label for="name">Full name</label><input id="name" name="name" autocomplete="name" value="">
<label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email" value="">
<div class="row"><div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="pw-help">
<p class="muted" id="pw-help">At least 10 characters with a letter, a number and a symbol. <span id="strength" aria-live="polite"></span></p></div>
<div><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password"></div></div>
<fieldset style="border:0;padding:0"><legend><strong>Plan</strong></legend><div class="row"><label class="card"><input type="radio" name="plan" value="free" checked> Free</label><label class="card"><input type="radio" name="plan" value="pro"> Pro · $12/month</label><label class="card"><input type="radio" name="plan" value="team"> Team · $49/month</label></div></fieldset>
<label for="country">Country</label><select id="country" name="country"><option value="" selected>Choose a country</option><option value="CA">Canada</option><option value="US">United States</option><option value="ES">Spain</option><option value="GB">United Kingdom</option><option value="DE">Germany</option><option value="FR">France</option></select>
<label><input type="checkbox" name="newsletter" value="yes" checked> Send me the Kitebase newsletter and product offers</label>
<label><input type="checkbox" name="terms" value="yes"> I agree to the <a href="#terms">Terms of Service</a></label>
<p><button type="submit">Create account</button></p></form>
<script>const pw=document.getElementById("password"),out=document.getElementById("strength");pw.addEventListener("input",()=>{const v=pw.value;const n=[/[A-Za-z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(v)).length+(v.length>=10);out.textContent=["","Weak","Fair","Good","Strong"][n];});</script></main>
<footer class="foot">Kitebase is a foxbench mock site. Nothing here is real.</footer></body></html>
